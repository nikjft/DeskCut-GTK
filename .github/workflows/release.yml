name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build tools
        run: dnf install -y rpm-build make desktop-file-utils git tar gzip

      - uses: actions/checkout@v4

      - name: Build RPM
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ~/rpmbuild/SOURCES
          git archive --prefix="deskcut-gtk-${VERSION}/" -o ~/rpmbuild/SOURCES/"deskcut-gtk-${VERSION}.tar.gz" HEAD
          sed -i "s/^Version:.*/Version:        ${VERSION}/" packaging/deskcut-gtk.spec
          rpmbuild -ba packaging/deskcut-gtk.spec
          mkdir -p dist
          cp ~/rpmbuild/RPMS/noarch/*.rpm ~/rpmbuild/SRPMS/*.rpm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build deb
        run: packaging/build-deb.sh "${GITHUB_REF_NAME#v}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  release:
    needs: [rpm, deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "DeskCut-GTK ${GITHUB_REF_NAME#v}" \
            --generate-notes
